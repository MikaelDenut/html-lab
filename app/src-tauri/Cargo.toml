[package]
authors = ["Mikael Denut + Claude AI"]
name = "html-lab"
version = "0.1.6"
edition = "2021"
description = "HTML Lab: learn HTML and CSS"
publish = false

[[bin]]
name = "html-lab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
dunce = "1"
htmllab_core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
muda = "0.20"

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = "symbols"

# Faster local builds for the Intel test loop. The shipped build uses release.
[profile.quick]
inherits = "release"
lto = false
opt-level = 1
codegen-units = 16
incremental = true

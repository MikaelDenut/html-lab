[package]
authors = ["Mikael Denut + Claude AI"]
name = "htmllab_core"
version = "0.1.0"
edition = "2021"
description = "The pure Rust core of HTML Lab: kinds, names, folder scan, file saving, content, preferences."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
unicode-normalization = "=0.1.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
